<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nullspace</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
/* Hierarchy carries the granularity: a condensed display face for structure,
   dense tabular rows for scanning, detail revealed in place on click. */
:root{
  --paper:#fcfcfb; --surface:#ffffff; --tint:#f1f2f5; --sunken:#e9eaef;
  --line:#dcdfe7; --line-2:#c6cad6;
  --ink:#171a24; --soft:#5a6072; --faint:#8b91a1;
  --band:#14284b; --band-ink:#ffffff; --band-soft:#c4cede; --tab-idle:rgba(255,255,255,.14);
  --accent:#24508f; --accent-bg:#e4ebf7;
  --k-mech:#1d3f73; --k-mech-bg:#dfe8f7;
  --k-art:#7c2636; --k-art-bg:#f7e0e3;
  --k-scope:#734b0c; --k-scope-bg:#f7e8cf;
  --k-known:#1d5c38; --k-known-bg:#dcefe3;
  --k-none:#454b59; --k-none-bg:#e6e8ec;
  --marker:#fff0a0;
  --head:"Barlow Semi Condensed",Arial Narrow,Arial,sans-serif;
  --body:"Barlow",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14161f; --surface:#1a1d27; --tint:#1e2130; --sunken:#262a38;
  --line:#2d3142; --line-2:#3d4254;
  --ink:#eceef4; --soft:#a5abbc; --faint:#777e90;
  --band:#101a30; --accent:#7ba3dd; --accent-bg:#1d2b45;
  --k-mech:#cfdcf3; --k-mech-bg:#223555;
  --k-art:#f3cfd5; --k-art-bg:#4d2530;
  --k-scope:#f2dcb3; --k-scope-bg:#4a3717;
  --k-known:#c7e8d3; --k-known-bg:#1f3f2e;
  --k-none:#d6d9e0; --k-none-bg:#2f3340;
  --marker:#5c5220;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#14161f; --surface:#1a1d27; --tint:#1e2130; --sunken:#262a38;
  --line:#2d3142; --line-2:#3d4254;
  --ink:#eceef4; --soft:#a5abbc; --faint:#777e90;
  --band:#101a30; --accent:#7ba3dd; --accent-bg:#1d2b45;
  --k-mech:#cfdcf3; --k-mech-bg:#223555;
  --k-art:#f3cfd5; --k-art-bg:#4d2530;
  --k-scope:#f2dcb3; --k-scope-bg:#4a3717;
  --k-known:#c7e8d3; --k-known-bg:#1f3f2e;
  --k-none:#d6d9e0; --k-none-bg:#2f3340;
  --marker:#5c5220;
  color-scheme:dark;}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font:400 16.5px/1.5 var(--body);font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-underline-offset:3px}
a.lk{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid currentColor;outline-offset:2px}

/* ---- type scale: structure, then body, then data ---- */
h1{font-family:var(--head);font-weight:700;font-size:clamp(22px,2.6vw,29px);
  line-height:1.1;margin:0;letter-spacing:.1px;text-wrap:balance}
h2{font-family:var(--head);font-weight:700;font-size:20px;line-height:1.15;
  margin:34px 0 0;padding-bottom:5px;border-bottom:2px solid var(--ink);
  display:flex;align-items:baseline;gap:9px}
h2 .n{font-family:var(--body);font-weight:500;font-size:13px;color:var(--soft)}
h2 .note{margin-left:auto;font-family:var(--body);font-weight:400;font-size:12.5px;
  color:var(--faint)}
h3{font-family:var(--head);font-weight:600;font-size:16px;margin:20px 0 4px}
p{margin:9px 0;max-width:68ch}
.lede{font-size:15.5px;color:var(--soft);line-height:1.55;max-width:66ch;margin:6px 0 0}
.small{font-size:13px;color:var(--soft)}
.tiny{font-size:12px;color:var(--faint)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero}

button{font:500 14.5px/1 var(--body);color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:2px;padding:7px 12px;cursor:pointer;
  white-space:nowrap}
button:hover:not(:disabled){background:var(--tint)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--band);border-color:var(--band);color:#fff}
button.pri:hover:not(:disabled){background:#1d3663}
button.bare{border-color:transparent;background:transparent;color:var(--accent);
  text-decoration:underline;padding:5px 2px}
button.sm{font-size:13px;padding:5px 9px}
input,textarea,select{font:400 15px var(--body);color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:2px;padding:8px 10px;width:100%}
textarea{resize:vertical;line-height:1.5}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
::placeholder{color:var(--faint)}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100%}
@media(max-width:820px){.app{grid-template-columns:minmax(0,1fr)}.rail{display:none}}
.rail{background:var(--band);color:var(--band-ink);padding:18px 12px;
  display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.mark{font-family:var(--head);font-weight:700;font-size:19px;padding:0 8px 2px;
  letter-spacing:.2px}
.mark small{display:block;font-family:var(--body);font-weight:400;font-size:12px;
  color:var(--band-soft);letter-spacing:0;margin-top:1px}
.rsec{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--band-soft);
  font-weight:600;padding:16px 8px 4px}
.rail a.nav{display:flex;gap:8px;padding:5px 8px;border-radius:2px;font-size:14.5px;
  color:var(--band-soft);text-decoration:none}
.rail a.nav:hover{background:var(--tab-idle);color:#fff}
.rail a.nav.on{background:var(--paper);color:var(--ink);font-weight:600}
.rail a.nav .n{margin-left:auto;font-size:12.5px;opacity:.75}
.rfoot{margin-top:auto;padding:10px 8px 0;border-top:1px solid rgba(255,255,255,.16);
  font-size:12px;color:var(--band-soft);line-height:1.5}

.bar{border-bottom:1px solid var(--line);padding:14px 26px 13px;display:flex;
  align-items:flex-start;gap:14px;background:var(--paper);position:sticky;top:0;z-index:5}
.bar .who{font-size:13px;color:var(--soft);white-space:nowrap;padding-top:6px}
.grow{flex:1;min-width:0}
.body{padding:18px 26px 70px;max-width:1080px}

/* ---- the result itself, first thing on the page ---- */
.facts{display:grid;grid-template-columns:78px minmax(0,1fr);gap:0 16px;
  border-top:1px solid var(--line);margin:14px 0 0}
.facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);
  font-weight:600;padding:9px 0 9px;border-bottom:1px solid var(--line)}
.facts dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line);
  font-size:15px;line-height:1.5}
@media(max-width:620px){.facts{grid-template-columns:minmax(0,1fr)}
  .facts dt{border-bottom:0;padding-bottom:0}}

.verdict{display:flex;gap:11px;align-items:baseline;margin:14px 0 0;
  padding:11px 13px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent)}
.verdict.warn{border-left-color:#b07d1c}
.verdict.good{border-left-color:#1d5c38}
.verdict .vt{font-size:15px;line-height:1.5;max-width:74ch}

/* ---- tables: one line per thing, detail opens beneath ---- */
table.t{border-collapse:collapse;width:100%;font-size:14.5px;line-height:1.35;
  margin-top:0;table-layout:fixed}
table.t th{text-align:left;font:600 12px var(--body);color:var(--soft);
  padding:7px 8px;border-bottom:1px solid var(--line-2);
  text-transform:uppercase;letter-spacing:.6px}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.row{cursor:pointer}
tr.row:hover td{background:var(--tint)}
tr.row.open td{background:var(--tint);border-bottom-color:transparent}
tr.det>td{background:var(--tint);padding:0 8px 20px;border-bottom:1px solid var(--line)}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.c{text-align:right;white-space:nowrap;color:var(--soft);font-size:13px}
td.dot{padding-left:10px}
.mk{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.mk.mech{background:var(--k-mech)} .mk.art{background:var(--k-art)}
.mk.scope{background:var(--k-scope)} .mk.known{background:var(--k-known)}

.tag{display:inline-block;font-size:12px;font-weight:500;line-height:1.3;
  padding:1px 6px;border-radius:2px;white-space:nowrap;background:var(--k-none-bg);color:var(--k-none)}
.tag.mech{background:var(--k-mech-bg);color:var(--k-mech)}
.tag.art{background:var(--k-art-bg);color:var(--k-art)}
.tag.scope{background:var(--k-scope-bg);color:var(--k-scope)}
.tag.known{background:var(--k-known-bg);color:var(--k-known)}
.tag.acc{background:var(--accent-bg);color:var(--accent)}
.tag.out{background:transparent;color:var(--soft);box-shadow:inset 0 0 0 1px var(--line-2)}

.bars{display:inline-flex;gap:1.5px;align-items:flex-end;height:11px}
.bars i{width:3px;background:var(--line-2);display:block}
.bars i.on{background:var(--accent)}

/* ---- detail card inside an expanded row ---- */
.card{display:grid;gap:12px;padding-top:4px;min-width:0}
.card .why{font-size:15px;line-height:1.55;max-width:72ch;margin:0}
.card .ev{font-size:14px;line-height:1.5;color:var(--soft);max-width:72ch;margin:0;
  border-left:2px solid var(--line-2);padding-left:11px}
.refs{display:grid;gap:0}
.ref{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:6px 0;
  border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.ref .y{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.ref .m{display:block;font-size:12.5px;color:var(--faint);margin-top:1px}
.ref .f{display:block;font-size:11.5px;color:var(--faint);font-family:var(--mono);
  margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.exp{background:var(--surface);border:1px solid var(--line);padding:10px 12px;max-width:74ch}
.exp b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;
  color:#1d5c38;margin-bottom:3px;font-weight:600}
.exp span{font-size:14.5px;line-height:1.5;color:var(--soft)}
.msg{background:var(--surface);border:1px solid var(--line);padding:10px 12px;
  font-size:14.5px;line-height:1.55;color:var(--soft);max-width:74ch}
mark{background:var(--marker);color:var(--ink);padding:0 2px}

/* ---- forms, interview, misc ---- */
.drop{border:1px dashed var(--line-2);background:var(--surface);padding:26px 18px;
  text-align:center}
.drop.over{border-color:var(--accent);background:var(--accent-bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13.5px;padding:5px 10px;border:1px solid var(--line-2);background:var(--surface);
  color:var(--ink);cursor:pointer;border-radius:2px}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.turn{padding:10px 0;border-bottom:1px solid var(--line)}
.turn .w{font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;
  color:var(--faint);margin-bottom:3px}
.turn.q .w{color:var(--accent)}
.turn .tx{font-size:15.5px;line-height:1.5}
.turn.a .tx{color:var(--soft)}
.rec .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#9b3a3a;margin-right:5px}
.rec.on .pulse{animation:p 1.1s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
.sk{background:linear-gradient(90deg,var(--tint) 25%,var(--sunken) 50%,var(--tint) 75%);
  background-size:200% 100%;animation:sh 1.3s linear infinite;height:11px}
@keyframes sh{to{background-position:-200% 0}}
.log{font-family:var(--mono);font-size:12.5px;color:var(--soft);line-height:1.6;
  max-height:170px;overflow:auto;border:1px solid var(--line);background:var(--surface);
  padding:9px 11px}
.log .ind{padding-left:14px;color:var(--faint)}
.wait{display:flex;align-items:center;gap:10px;padding:12px 0}
.empty{padding:40px 2px;color:var(--soft);font-size:15px}
.empty b{display:block;font-family:var(--head);font-weight:600;font-size:18px;
  color:var(--ink);margin-bottom:4px}
.err{border:1px solid #d9b3b3;background:#f7ecec;color:#7a2e2e;padding:10px 12px;
  font-size:14px;margin:10px 0}
.hide{display:none}
.center{max-width:480px;margin:10vh auto;padding:0 22px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 0}
.tally{margin-left:auto;font-size:13px;color:var(--soft)}


/* ---- the wall: one card per result, because a square with a colour on it
   is not a unit of science. The card carries what was expected, what was seen,
   and what the field has since done about it. ---- */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:10px;
  margin-top:16px}
.unit{border:1px solid var(--line);background:var(--surface);border-top:3px solid var(--line-2);
  padding:11px 12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  min-height:152px;transition:border-color .4s ease,box-shadow .18s ease,transform .18s ease}
.unit:hover{box-shadow:0 2px 0 var(--line-2);transform:translateY(-1px);border-color:var(--line-2)}
.unit .hd{display:flex;align-items:baseline;gap:7px;font-size:11px;letter-spacing:.6px;
  text-transform:uppercase;font-weight:600;color:var(--faint)}
.unit .hd .st{margin-left:auto;font-size:10.5px}
.unit .cl{font-size:14px;line-height:1.3;font-weight:500;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.unit .ob{font-size:12.5px;line-height:1.4;color:var(--soft);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.unit .ft{margin-top:auto;font-size:11.5px;color:var(--faint);display:flex;gap:6px;
  align-items:baseline}
.unit .ft .y{font-family:var(--mono)}
.unit.green{border-top-color:#2f7d4f}
.unit.amber{border-top-color:#c08a2a}
.unit.red{border-top-color:#9b3a3a}
.unit.green .hd .st{color:#2f7d4f}
.unit.amber .hd .st{color:#a3741f}
.unit.red .hd .st{color:#9b3a3a}
.unit.green{background:linear-gradient(0deg,var(--surface),var(--surface)),#2f7d4f10}
.unit .mv{font-size:12.5px;line-height:1.4;border-top:1px solid var(--line);padding-top:6px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.unit.green .mv{color:#2f7d4f}
.unit.amber .mv{color:#8a6420}
.unit.red .mv{color:#9b3a3a}
.scrub{display:flex;align-items:center;gap:14px;margin-top:18px;max-width:620px}
.scrub input[type=range]{flex:1;width:auto;padding:0;border:0;background:transparent;
  accent-color:var(--accent)}
.scrub .yr{font-family:var(--head);font-weight:700;font-size:30px;min-width:92px;
  line-height:1}
.keys{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--soft)}
.keys b{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;
  vertical-align:-1px}

/* ---- landing: wide, so the product is visible before anyone signs up ---- */
.land{max-width:860px;margin:0 auto;padding:46px 26px 80px}
.hero h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.2px}
.hero .sub{font-size:19px;line-height:1.45;color:var(--soft);max-width:34em;margin:12px 0 0}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:34px;
  border-top:1px solid var(--line)}
@media(max-width:700px){.steps{grid-template-columns:minmax(0,1fr)}}
.steps .s{padding:16px 18px 18px 0;border-right:1px solid var(--line)}
.steps .s:last-child{border-right:0}
@media(max-width:700px){.steps .s{border-right:0;border-bottom:1px solid var(--line);
  padding-right:0}}
.steps .s .k{font-family:var(--mono);font-size:12px;color:var(--faint);display:block;
  margin-bottom:6px}
.steps .s b{font-family:var(--head);font-weight:600;font-size:17px;display:block;
  margin-bottom:4px}
.steps .s span{font-size:14.5px;color:var(--soft);line-height:1.5}
.peek{border:1px solid var(--line);background:var(--surface);margin-top:34px}
.peek .ph{padding:9px 14px;border-bottom:1px solid var(--line);font-size:11.5px;
  text-transform:uppercase;letter-spacing:.8px;color:var(--faint);font-weight:600;
  background:var(--tint)}

/* ---- stepper: onboarding that says where you are ---- */
.stepper{display:flex;gap:0;align-items:center;margin:0 0 6px;font-size:12px;
  color:var(--faint);font-weight:500}
.stepper i{font-style:normal;padding:3px 0;margin-right:16px;position:relative}
.stepper i.on{color:var(--accent);font-weight:600}
.stepper i.done{color:var(--soft)}

/* ---- the "do this next" card: one decision per block ---- */
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;
  margin-top:14px}
.pick{border:1px solid var(--line);background:var(--surface);padding:14px 15px;
  text-align:left;display:block;width:100%;cursor:pointer;border-radius:2px}
.pick:hover{border-color:var(--accent);background:var(--accent-bg)}
.pick b{font-family:var(--head);font-weight:600;font-size:16.5px;display:block;
  margin-bottom:3px}
.pick span{font-size:14px;color:var(--soft);line-height:1.45;display:block;white-space:normal}

/* ---- home: counters that state what changed, not decoration ---- */
.stats{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);margin-top:16px}
.stat{padding:11px 22px 11px 0;margin-right:22px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .v{font-family:var(--head);font-weight:700;font-size:25px;line-height:1.1;
  display:block}
.stat .l{font-size:12.5px;color:var(--soft)}
.stat.lit .v{color:var(--accent)}

/* ---- visibility: a tier is a decision, so it looks like one ---- */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:2px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line-2);border-radius:0;
  padding:6px 11px;font-size:13.5px;background:var(--surface)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--band);color:#fff}
.gate{border:1px solid var(--line);border-left:3px solid #b07d1c;background:var(--surface);
  padding:11px 13px;margin-top:10px;font-size:14px;line-height:1.5;color:var(--soft);
  max-width:74ch}
.gate b{color:var(--ink)}
.sign{display:flex;gap:9px;align-items:center;font-size:13.5px;color:var(--soft);
  padding:7px 0;border-bottom:1px solid var(--line)}
.rng{display:flex;align-items:center;gap:12px;max-width:430px;margin-top:9px}
.rng input[type=range]{flex:1;width:auto;padding:0;border:0;background:transparent;
  accent-color:var(--accent)}
.rng .v{font-family:var(--mono);font-size:15px;min-width:46px;text-align:right}

/* ---- provenance banner for a result nobody logged ---- */
.band-note{border:1px solid var(--line);border-left:3px solid var(--k-scope);
  background:var(--surface);padding:12px 14px;margin:14px 0 0;max-width:80ch}
.band-note .t{font-size:11px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;
  color:var(--k-scope);margin-bottom:4px}
</style>
</head>
<body><div id="root"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='nullspace_token';
let TOKEN=localStorage.getItem(KEY)||'',ME=null,WORLD=[],BUSY=false,SCHED={on:false,every:180,runs:0};

const api=async(p,o={})=>{const r=await fetch(p,{...o,headers:{'Content-Type':'application/json','X-Token':TOKEN,...(o.headers||{})}});
  const d=await r.json().catch(()=>({error:'bad response'}));
  if(!r.ok&&d.error)throw new Error(d.error);return d;};
const poll=async(job,cb)=>{for(;;){const j=await api('/api/job?id='+job);cb&&cb(j);
  if(j.status==='done')return j.result;if(j.status==='error')throw new Error(j.error);
  await new Promise(z=>setTimeout(z,850));}};

  if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';
  if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'d';};
const copy=(t,b)=>navigator.clipboard.writeText(t).then(()=>{const o=b.textContent;
  b.textContent='Copied';setTimeout(()=>b.textContent=o,1300)}).catch(()=>{});
const KIND={mechanism:['mech','mechanism'],artifact:['art','artifact'],

/* Status is what the agent concluded, not a bucket the scientist has to choose.

/* One waiting state everywhere, so a queued job never looks hung. */
function waiting(el,what){
  if(!el)return()=>{};
  el.innerHTML=`<div class="wait"><span class="sk" style="width:120px;height:9px"></span>
    <span class="small" id="wmsg">${esc(what)}</span></div>`;
  return j=>{const m=$('#wmsg',el);if(!m)return;
    m.textContent = j.status==='queued'
      ? `waiting behind ${j.position} other ${j.position===1?'job':'jobs'} — one runs at a time`
      : what;};
}

async function runAgent(){
  if(BUSY)return;BUSY=true;
  const b=$('#workBtn');if(b){b.disabled=true;b.textContent='Working';}
  $('#work').innerHTML=`<h2 style="margin-top:0">Your agent <span class="note" id="rh">starting</span></h2>
    <div class="log" id="rlog" style="margin-top:9px"></div>`;
  try{
    const {job}=await api('/api/tick',{method:'POST',body:JSON.stringify({mine_only:true,rounds:3})});
    let seen=0;
    await poll(job,j=>{
      if(j.status==='queued'){$('#rh').textContent=`queued, ${j.position} ahead`;return;}
      $('#rh').textContent='working';
      const L=j.log||[];
      if(L.length>seen){const box=$('#rlog');
        L.slice(seen).forEach(l=>{const d=document.createElement('div');
          if(l.startsWith('    '))d.className='ind';d.textContent=l.trim();box.appendChild(d)});
        box.scrollTop=box.scrollHeight;seen=L.length;}
    });
    BUSY=false;
    const d=await api('/api/me');ME=d.scientist;ME.unread=d.unread;ME.pending=d.pending||[];
    route();
  }catch(e){BUSY=false;$('#work').innerHTML=`<div class="err">${esc(e.message)}</div>`;wire();}
}

/* expand-in-place for any table built by `rows()` */
function expandable(scope){
  $$('tr.row',scope||document).forEach(tr=>tr.onclick=ev=>{
    if(ev.target.closest('a')||ev.target.closest('button'))return;
    const det=tr.nextElementSibling;
    if(!det||!det.classList.contains('det'))return;
    const open=!det.classList.contains('hide');
    det.classList.toggle('hide',open);tr.classList.toggle('open',!open);
  });
}

/* ---------------------------------------------------------------- wall
   The aggregate claim in one screen, as units rather than pixels. Each card is
   a result somebody actually has: what they expected, what they saw. Drag the
   year and the cards change — not just their colour, their contents, because
   what changed is what the literature now says about them. Every date is a
   real publication date, so this is a record and not an animation. */
let GRID=null,GY=null,GFILT='all';
async function viewGrid(){
  if(!GRID)GRID=await api('/api/answerable');
  const rows=(GRID.rows||[]).slice().sort((a,b)=>(a.year||0)-(b.year||0));
  const years=rows.map(r=>r.year).filter(Boolean)
    .concat(rows.map(r=>r.changed_in).filter(Boolean));
  const y0=Math.min(...years,2015),y1=Math.max(...years,new Date().getFullYear());
  if(GY==null)GY=y1;

  $('#root').innerHTML=shell(
    `<div><h1>What happens to a null</h1>
      <p class="lede">Every result in this repository, one card each, from the year it was
        shelved. Drag the year: a card changes in the year the work that changed it was
        actually published. Nothing here is on a timer.</p></div>`,`
    <div class="scrub">
      <span class="yr" id="gy">${GY}</span>
      <input type="range" id="gsl" min="${y0}" max="${y1}" step="1" value="${GY}">
      <button class="sm" id="gplay">Play</button></div>
    <div class="keys">
      <span><b style="background:var(--line-2)"></b>shelved, nothing since</span>
      <span><b style="background:#c08a2a"></b>question narrowed</span>
      <span><b style="background:#2f7d4f"></b>answerable now</span>
      <span><b style="background:#9b3a3a"></b>someone else published it</span></div>
    <div class="stats" id="gstats"></div>
    <div class="toolbar" id="gfilt">
      ${[['all','Everything'],['green','Worth picking up'],['amber','Narrowed'],
         ['grey','Still nothing']].map(([k,l])=>
        `<button class="sm ${GFILT===k?'pri':''}" data-f="${k}">${l}</button>`).join('')}
      <span class="tally" id="gcount"></span></div>
    <div class="wall" id="gw"></div>
    <p class="tiny" style="margin-top:16px">${rows.length} real results. Each is a logged
      experiment or a negative result an agent pulled out of a published paper, and every
      change of state is dated by the paper that caused it. Nothing is filled in to make
      the wall look busier.</p>
    `,'grid');
  wire();paintGrid(rows);
  const sl=$('#gsl');
  sl.oninput=()=>{GY=+sl.value;$('#gy').textContent=GY;paintGrid(rows);};
  $('#gplay').onclick=()=>{
    let y=y0;const t=setInterval(()=>{
      if(y>y1){clearInterval(t);return;}
      GY=y;sl.value=y;$('#gy').textContent=y;paintGrid(rows);y++;},700);};
  $$('#gfilt [data-f]').forEach(b=>b.onclick=()=>{GFILT=b.dataset.f;viewGrid();});
}
/* A card is grey until the work that changes it exists. Nothing is coloured
   before its own evidence is published. */
function stateAt(r,y){
  // An undated result cannot be placed on the timeline, so it sits grey
  // throughout rather than pretending to a year it does not have.
  if(!r.year)return 'grey';
  if(r.year>y)return 'future';
  if(!r.changed_in||r.changed_in>y)return 'grey';
  if(r.scooped)return 'red';
  if(r.overall==='resolved')return 'green';
  if(r.overall==='narrowed')return 'amber';
  return 'grey';
}
const STATE_WORD={grey:'no answer yet',amber:'narrowed',green:'answerable',
  red:'published by others'};

function paintGrid(rows){
  const all=rows.filter(r=>!r.year||r.year<=GY);
  const shown=GFILT==='all'?all:all.filter(r=>stateAt(r,GY)===GFILT);
  const k=s=>all.filter(r=>stateAt(r,GY)===s).length;

  const st=$('#gstats');
  if(st)st.innerHTML=`
    <div class="stat"><span class="v">${all.length}</span>
      <span class="l">shelved by ${GY}</span></div>
    <div class="stat"><span class="v" style="color:#2f7d4f">${k('green')}</span>
      <span class="l">worth picking up</span></div>
    <div class="stat"><span class="v" style="color:#c08a2a">${k('amber')}</span>
      <span class="l">narrowed</span></div>
    <div class="stat"><span class="v" style="color:#9b3a3a">${k('red')}</span>
      <span class="l">someone else published it</span></div>`;
  const ct=$('#gcount');
  if(ct)ct.textContent=`${shown.length} of ${all.length} shown`;

  const w=$('#gw');if(!w)return;
  w.innerHTML=shown.map((r,i)=>{
    const s=stateAt(r,GY),moved=s!=='grey';
    return `<article class="unit ${s==='grey'?'':s}" data-i="${i}">
      <div class="hd"><span>${esc((r.lab||'').replace(' Lab',''))}</span>
        <span class="st">${esc(STATE_WORD[s]||'')}</span></div>
      <div class="cl">${esc(r.title||'')}</div>
      ${r.observed?`<div class="ob">${esc(r.observed)}</div>`:''}
      ${moved&&r.what_the_field_did
        ? `<div class="mv">Since ${r.changed_in}: ${esc(r.what_the_field_did)}</div>`:''}
      <div class="ft"><span class="y">shelved ${r.year||'?'}</span>
        ${r.origin==='literature'?'<span>&middot; from a paper</span>':''}
        ${r.n_cosigns?`<span>&middot; ${r.n_cosigns} co-signed</span>`:''}
        ${r.assigned_to?`<span>&middot; ${esc(r.assigned_to.split(' ')[0])} has it</span>`:''}
      </div></article>`;}).join('')
    || `<div class="empty"><b>Nothing in this state yet.</b></div>`;
  $$('#gw .unit').forEach(c=>{const r=shown[+c.dataset.i];
    c.onclick=()=>{location.hash='#/result/'+r.id;route();};});
}

/* ---------------------------------------------------------------- repository
   The repository read from outside a lab, by somebody looking for a project
   rather than somebody tidying their own. A null is worth picking up when the
   field has moved under it, so that is what the list is sorted by. */
const SINCE={
  resolved:['known','answered since it was shelved',
    'Work published after this was shelved explains it. What is left is confirming it applies here, which is usually cheap.'],
  narrowed:['scope','narrowed since it was shelved',
    'Later work rules some explanations out without settling it. The remaining question is sharper than the original one.'],
  open:['out','nothing published since',
    'The field has not touched this. Still a real question, and still nobody has answered it.']};

async function viewRepo(){
  const d=await api('/api/answerable');
  const rows=d.rows||[];

          title="${esc(r.title)}">${esc(r.title)}</a>

          r.origin==='literature'?' &middot; from a paper':''}</span></td>
      <td>${r.overall?`<span class="tag ${SINCE[r.overall][0]}">${SINCE[r.overall][1]}</span>`
        :(r.read?'<span class="tag out">not re-checked</span>':'<span class="tag out">not read</span>')}</td>
      <td>${r.n_newer?`<span class="tag acc">${r.n_newer} since</span>`:''}</td>
      <td class="c">${r.assigned_to?esc(r.assigned_to.split(' ')[0]):(r.unclaimed?'free':'')}</td>
      <td class="c">${r.year||''}</td></tr>
    ${r.what_the_field_did?`<tr class="det hide"><td colspan="6"><div class="card">
      <p class="why">${esc(r.what_the_field_did)}</p>
      ${r.cheapest?`<div class="exp"><b>cheapest way back in</b><span>${esc(r.cheapest)}</span></div>`:''}
      ${r.agent_was_right===false?`<p class="tiny">The agent's own top explanation did not hold up.</p>`:''}
      <div><a href="#/result/${r.id}"><button class="pri sm">Open this result</button></a></div>
    </div></td></tr>`:''}`;

  $('#root').innerHTML=shell(
    `<div><h1>Ready to pick up</h1>
      <p class="lede">Every result in this repository that you can see, across ${
        (d.labs||[]).length} ${(d.labs||[]).length===1?'lab':'labs'}, sorted by how much
        the field has moved since it was shelved. A null whose literature has changed
        is the cheapest project in science: the work is done, the question is sharper,
        and nobody is competing for it.</p></div>`,`
    <div class="stats">
      <div class="stat lit"><span class="v">${d.n_resolved||0}</span>
        <span class="l">now answered by later work</span></div>
      <div class="stat"><span class="v">${d.n_narrowed||0}</span>
        <span class="l">narrowed, not settled</span></div>
      <div class="stat"><span class="v">${rows.length}</span>
        <span class="l">results you can see</span></div>
      <div class="stat"><span class="v">${(d.labs||[]).length}</span>
        <span class="l">labs</span></div>
    </div>

    ${live.length?`<h2>The field moved under these <span class="n">${live.length}</span>
      <span class="note">click a line for what happened</span></h2>
      <table class="t"><colgroup><col style="width:22px"><col><col style="width:190px">
        <col style="width:76px"><col style="width:58px"><col style="width:44px"></colgroup>
      <thead><tr><th></th><th>Result</th><th>What happened since</th><th>New work</th>
        <th class="c">Taken</th><th class="c">Year</th></tr></thead>
      <tbody>${live.map(row).join('')}</tbody></table>`
      :`<div class="empty"><b>Nothing re-checked yet.</b>
        <p class="lede" style="margin:0">A result logged with an as-of date gets re-checked
          by its agent: it explains the null using only the literature of the time, then goes
          back and looks at what the field published afterwards. Run an agent to see it.</p></div>`}

    ${rest.length?`<h2>Everything else <span class="n">${rest.length}</span></h2>
      <table class="t"><colgroup><col style="width:22px"><col><col style="width:190px">
        <col style="width:76px"><col style="width:58px"><col style="width:44px"></colgroup>
      <tbody>${rest.map(row).join('')}</tbody></table>`:''}

/* ---------------------------------------------------------------- literature

   repository that stays empty, so the agent goes and reads papers for nulls

  $('#root').innerHTML=shell(
    `<div><h1>From the literature</h1>

    <div class="toolbar">

        style="flex:1;max-width:400px">

    <p class="tiny">Takes a few minutes. It refuses most papers &mdash; a paper whose

    <div id="mout"></div>

      :`<div class="empty"><b>Nothing mined yet.</b>
        <p class="lede" style="margin:0">Name a field above and your agent will read
          through the literature looking for results that were reported and then
          dropped. This is how the shelf fills before anyone adopts the product.</p></div>`}
    `,'lit');
  wire();
  $$('[data-go]').forEach(el=>el.onclick=()=>{location.hash=el.dataset.go;route()});
  $('#mgo').onclick=async()=>{
    $('#mgo').disabled=true;
    const tick=waiting($('#mout'),'your agent is writing searches');
    try{
      const {job}=await api('/api/mine',{method:'POST',
        body:JSON.stringify({topic:$('#mtopic').value.trim()})});
      let seen=0;
      const r=await poll(job,j=>{
        tick(j);
        const L=j.log||[];

          $('#mout').innerHTML=`<div class="log">${L.map(l=>
            `<div class="${l.startsWith('    ')?'ind':''}">${esc(l.trim())}</div>`).join('')}</div>`;

      setTimeout(()=>route(),900);
    }catch(e){$('#mout').innerHTML=`<div class="err">${esc(e.message)}</div>`;$('#mgo').disabled=false}
  };
}

/* ---------------------------------------------------------------- shelf */
const VIS={lab:['Lab only','Only people in your lab can see this.'],
  consortium:['Named labs','Labs you have named can see it. Nobody else can.'],
  public:['Public','Anyone can see it, and other agents can match against it.']};
let SHELF=null;
function groupProjects(rows){
  const out=[];
  rows.forEach(r=>{
    const key=r.project||'Not filed under a project';
    let g=out.find(x=>x.key===key);
    if(!g){g={key,context:r.project_context,rows:[]};out.push(g);}
    if(!g.context&&r.project_context)g.context=r.project_context;
    g.rows.push(r);
  });
  return out;
}
async function viewShelf(mine){
  const d=await api('/api/shelf');SHELF=d;ME.lab=d.lab;

          if(unread)bits.push(`<span class="tag out">${unread} not read</span>`);

      <h2>What the statuses mean</h2>

        <td class="small">${STATUS[k].means}</td></tr>`).join('')}</tbody></table>`
    :`<div class="empty"><b>Nothing on the shelf yet.</b>
       <p class="lede" style="margin:0 0 16px">This is where your lab's dead ends live:
         experiments that did not work, each under the project it belonged to. Log one and
         your agent reads the literature against it, including fields you would not search
         yourself, then finds the people who could settle it.</p>
       <div class="chips"><a href="#/new"><button class="pri">Log your first result</button></a>
         <a href="#/guide"><button class="sm">How this works</button></a></div></div>`,

  wire();

  $$('tr.row[data-proj]').forEach(el=>el.onclick=()=>
    location.hash='#/project/'+encodeURIComponent(el.dataset.proj));
}

    ${newer?`<p class="small" style="margin-top:12px">${newer} paper${newer===1?'':'s'}
      relevant to this project were published after the experiments were shelved.</p>`:''}
    <h2>Ask your agent about this</h2>
    <div class="chips" style="margin-top:10px">
      ${['What should someone picking this up read first?',
         'What is the cheapest experiment across these?',
         'Has anything changed since we shelved this?'].map(q=>
        `<button class="chip" data-ask="${esc(q+' (project: '+g.key+')')}">${esc(q)}</button>`).join('')}</div>
    `,'shelf');
  wire();
  $$('tr.row[data-rid]').forEach(el=>el.onclick=()=>location.hash='#/result/'+el.dataset.rid);

    location.hash='#/ask';route();setTimeout(()=>sendChat(b.dataset.ask,true),60)});
}

/* ---------------------------------------------------------------- result */

  const newer=(a.papers||[]).filter(x=>(x.year||0)>(c.year||9999))
    .sort((x,y)=>(y.year||0)-(x.year||0));
  const matches=(d.matches||[]).filter(m=>m.can_help);
  const isMine=d.scientist.id===ME.id;

  const hypTable=`<table class="t">

        <td class="dot"><span class="mk ${k}"></span></td>

        ${(h.papers||[]).length?`<div class="refs">${h.papers.map(x=>refHtml(x,true)).join('')}</div>`

     <span class="who">${esc(d.scientist.name)} &middot; ${c.year||''}</span>`,`

    ${hs.length?`<h2>Explanations <span class="n">${hs.length}</span>

    ${matches.length?`<h2>Who could settle it <span class="n">${matches.length}</span>

      <span class="note">the same result in their vocabulary</span></h2>
      <p class="lede" style="margin-bottom:10px">${esc(d.signal.plain||'')}</p>
      <table class="t"><colgroup><col style="width:22px"><col style="width:190px"><col></colgroup>
      <tbody>${(d.signal.restatements||[]).map(r=>`<tr class="row">
        <td class="dot"><span class="mk mech"></span></td>
        <td>${esc(r.field)}</td>

}


/* The check that makes the claim falsifiable: the agent reasoned with the
   literature of the time, and this is what the field went on to publish. */
function sinceHtml(sc,p){
  if(!sc)return '';
  const V={supported:['known','held up'],contradicted:['art','contradicted'],
    superseded:['scope','superseded'],untouched:['','nothing bears on it']};
  const o=sc.overall||'open';
  return `<h2>What the field did since ${esc(p.as_of||p.card.year||'')}
      <span class="note">the agent could not see any of this when it reasoned</span></h2>
    <div class="verdict ${o==='resolved'?'good':o==='narrowed'?'':'warn'}">
      <span class="tag ${SINCE[o]?SINCE[o][0]:'out'}">${esc(SINCE[o]?SINCE[o][1]:o)}</span>
      <span class="vt">${esc(sc.what_the_field_did||'')}</span></div>
    ${sc.agent_was_right!=null?`<p class="small" style="margin-top:9px">Its own top explanation
      <b>${sc.agent_was_right?'held up':'did not hold up'}</b>.${
      sc.best_missed?' What it should have proposed: '+esc(sc.best_missed):''}</p>`:''}
    ${(sc.verdicts||[]).length?`<table class="t" style="margin-top:12px">
      <colgroup><col style="width:22px"><col style="width:128px"><col><col style="width:44px"></colgroup>
      <thead><tr><th></th><th>Explanation</th><th>What later work did to it</th><th class="c">Refs</th></tr></thead>
      <tbody>${sc.verdicts.map(v=>{
        const k=V[v.verdict]||['',v.verdict||''];
        return `<tr class="row">
          <td class="dot"><span class="mk ${k[0]}"></span></td>
          <td><span class="tag ${k[0]||'out'}">${esc(k[1])}</span>
            <span class="tiny" style="display:block">ranked ${v.rank}</span></td>
          <td class="clip" title="${esc(v.why||'')}">${esc(v.why||'')}</td>
          <td class="c">${(v.papers||[]).length}</td></tr>
        <tr class="det hide"><td colspan="4"><div class="card">
          <p class="why">${esc(v.why||'')}</p>
          ${(v.papers||[]).length?`<div class="refs">${v.papers.map(x=>refHtml(x)).join('')}</div>`:''}
        </div></td></tr>`}).join('')}</tbody></table>`:''}`;
}

/* The handover. Different reader, different page: cost and stopping rules
   rather than interpretation. */
function pickupHtml(k){
  return `<dl class="facts">
    <dt>Where it stopped</dt><dd>${esc(k.where_it_stopped||'')}</dd>
    ${(k.what_exists||[]).length?`<dt>You inherit</dt><dd>${
      k.what_exists.map(x=>`<div class="sign" style="align-items:flex-start">
        <span class="mk known" style="margin-top:6px;flex:none"></span>
        <span style="color:var(--ink)">${esc(x)}</span></div>`).join('')}</dd>`:''}
    <dt>Do this first</dt><dd>${esc(k.first_thing||'')}</dd>
    <dt>Stop if</dt><dd>${esc(k.would_make_me_stop||'')}</dd>
    ${k.what_changed?`<dt>Changed since</dt><dd>${esc(k.what_changed)}</dd>`:''}
    ${(k.read_first||[]).length?`<dt>Read first</dt><dd>${k.read_first.map(r=>
      `<div style="margin-bottom:6px">${esc(r.title)}
        <span class="tiny" style="display:block">${esc(r.why||'')}</span></div>`).join('')}</dd>`:''}
  </dl>
  ${k.honest_warning?`<div class="gate" style="border-left-color:var(--k-art)">
    <b>What the last person would tell you over coffee.</b> ${esc(k.honest_warning)}</div>`:''}`;
}

/* Who can see it, how sure the scientist is, and who else stands behind it.
   These three together are the only answer to "won't this fill with junk". */
function shareHtml(p,d,isMine){
  const vis=p.visibility||'lab',flags=(p.card.quality_flags||[]).length;
  const signs=p.cosigns||[];
  const alreadySigned=signs.some(s=>s.scientist_id===ME.id);
  return `<h2>Who can see this <span class="note">${esc(VIS[vis][0])}</span></h2>
    ${isMine?`<div class="toolbar"><div class="seg">${Object.keys(VIS).map(k=>
      `<button class="${k===vis?'on':''}" data-vis="${k}">${esc(VIS[k][0])}</button>`).join('')}</div>
      <span class="small">${esc(VIS[vis][1])}</span></div>`
      :`<p class="small" style="margin-top:9px">${esc(VIS[vis][1])}
         Visibility is ${esc(d.scientist.name)}'s to change.</p>`}
    <div id="visgate"></div>
    ${isMine&&flags&&vis==='lab'?`<p class="tiny" style="margin-top:8px">Your agent flagged
      ${flags} thing${flags===1?'':'s'} about this result. You will see them before
      it goes anywhere.</p>`:''}

    <h2>How sure are you <span class="note">the scientist's own number, not the agent's</span></h2>
    ${isMine?`<div class="rng">
        <span class="small">not at all</span>
        <input type="range" id="conf" min="0" max="100" step="5" value="${p.confidence??50}">
        <span class="small">certain</span>
        <span class="v" id="confv">${p.confidence==null?'&mdash;':p.confidence+'%'}</span></div>
      <p class="tiny">How confident you are that the effect is real, as opposed to something
        your method could not have seen. Separate from the support bars above, which are
        the agent's read of the literature.</p>`
      :`<p class="small" style="margin-top:9px">${p.confidence==null
        ?'Not set by the person who ran it.'
        :esc(d.scientist.name)+' put this at '+p.confidence+'%.'}</p>`}

    <h2>Co-signed <span class="n">${signs.length}</span>
      <span class="note">someone else willing to put their name to it</span></h2>
    ${signs.length?`<div style="margin-top:6px">${signs.map(s=>`<div class="sign">
      <span class="mk known"></span><b style="color:var(--ink)">${esc(s.name)}</b>
      <span>${esc(s.note||'')}</span></div>`).join('')}</div>`
      :`<p class="small" style="margin-top:9px">Nobody yet. One co-signer is the whole
        quality bar here: cheap for them, and it is what stops a repository of nulls
        filling with things nobody would defend.</p>`}
    ${!isMine&&!alreadySigned?`<div style="margin-top:10px">
      <input id="csnote" placeholder="optional: what you are vouching for" style="max-width:430px">
      <div class="toolbar"><button class="sm" id="cosign">Co-sign this result</button>
        <span class="small">You are saying the data supports the negative conclusion,
          not that you agree about why.</span></div></div>`:''}`;
}
/* `found by` is the provenance line. It earns its space inside an explanation,
   where the reader is checking the agent's reasoning, and crowds a plain list. */
function refHtml(p,showProvenance){
  return `<div class="ref"><span class="y">${p.year||''}</span><span>
    ${p.url?`<a class="lk" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`:esc(p.title)}
    <span class="m">${esc(p.venue||'')}${p.cited_by_count!=null?' &middot; '+p.cited_by_count+' cited':''}</span>
    ${showProvenance&&p.found_by?`<span class="f" title="${esc(p.found_by)}">found by: ${esc(p.found_by)}</span>`:''}</span></div>`;
}
function verdictOf(hs){
  const top=hs[0]||{};
  if(!hs.length)return{cls:'',k:'',chip:'not read',fallback:'Your agent has not read anything against this yet.'};
  if(top.kind==='artifact')return{cls:'warn',k:'art',chip:'cannot tell yet',
    fallback:'The experiment cannot separate a real absence from a measurement that was never calibrated.'};
  if(top.kind==='already_known')return{cls:'good',k:'known',chip:'already answered',
    fallback:'The explanation is in the literature below.'};
  if(top.kind==='scope')return{cls:'',k:'scope',chip:'narrower than assumed',
    fallback:'Real within limits the original expectation did not account for.'};
  return{cls:'',k:'mech',chip:'needs an explanation',fallback:'Your agent found work that bears on this.'};
}
function scoreHtml(s){
  return `<h2>Scored against what the scientist concluded
    <span class="note">${esc(s.grade)}</span></h2>
    <dl class="facts">
      <dt>Mechanism</dt><dd>${s.found_mechanism?'found':'missed'}${s.mechanism_rank?`, ranked ${s.mechanism_rank}`:''}</dd>
      <dt>Key paper</dt><dd>${s.found_key_paper?'found':'missed'}</dd>
      <dt>Experiment</dt><dd>${s.proposed_matching_experiment?'matched':'did not match'}</dd>
      <dt>Notes</dt><dd>${esc(s.notes)}</dd></dl>`;
}

function addFiles(fs){
  fs.forEach(f=>{const r=new FileReader();
    r.onload=()=>{FILES.push({name:f.name,size:f.size,text:String(r.result).slice(0,20000)});
      $('#flist').innerHTML=`<table class="t" style="margin-top:8px"><tbody>${FILES.map(x=>
        `<tr><td>${esc(x.name)}</td><td class="c">${(x.size/1024).toFixed(0)} KB</td></tr>`).join('')}</tbody></table>`;
      const ta=$('#paste');if(ta&&!ta.value.trim())ta.value=FILES.map(x=>x.text).join('\n\n').slice(0,6000);};
    r.readAsText(f)});
}
function dictate(target){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){const e=$('#lerr')||$('#ierr');
    if(e)e.innerHTML=`<div class="err">This browser has no speech recognition. Chrome does.</div>`;return;}
  if(window.__rec){window.__rec.stop();window.__rec=null;
    $$('.rec').forEach(r=>r.classList.remove('on'));return;}
  const rec=new SR();window.__rec=rec;
  rec.continuous=true;rec.interimResults=true;rec.lang='en-US';
  const base=target.value?target.value+' ':'';
  rec.onresult=ev=>{let out='';
    for(let i=0;i<ev.results.length;i++)out+=ev.results[i][0].transcript;
    target.value=base+out;};
  rec.onend=rec.onerror=()=>{window.__rec=null;$$('.rec').forEach(r=>r.classList.remove('on'))};
  rec.start();$$('.rec').forEach(r=>r.classList.add('on'));
}
async function askNext(){
  const tick=waiting($('#ierr'),'your agent is reading what you wrote');
  try{const {job}=await api('/api/interview/next',{method:'POST',body:JSON.stringify({transcript:TR})});
    const r=await poll(job,tick);$('#ierr').innerHTML='';
    if(r.done)return buildProblem();
    TR.push({role:'agent',text:r.question});drawLog();
    $('#inbox').classList.remove('hide');$('#ans')?.focus();
  }catch(e){$('#ierr').innerHTML=`<div class="err">${esc(e.message)}</div>`}
}
async function autoAnswer(){
  const q=[...TR].reverse().find(t=>t.role==='agent');if(!q)return;
  $('#auto').disabled=true;$('#ans').value='';
  const tick=waiting($('#ierr'),'answering from the notebook');
  try{const {job}=await api('/api/interview/answer',{method:'POST',
      body:JSON.stringify({example_id:EXID,question:q.text,transcript:TR})});
    const r=await poll(job,tick);$('#ierr').innerHTML='';
    $('#ans').value=r.answer||'';$('#auto').disabled=false;
  }catch(e){$('#ierr').innerHTML=`<div class="err">${esc(e.message)}</div>`;$('#auto').disabled=false}
}
async function buildProblem(){
  const tick=waiting($('#stage'),'writing your result down');
  try{const {job}=await api('/api/problem/create',{method:'POST',
      body:JSON.stringify({transcript:TR,paste:PASTE})});
    const r=await poll(job,tick);TR=[];PASTE='';EXID=null;FILES=[];
    const d=await api('/api/me');ME=d.scientist;ME.unread=d.unread;ME.pending=d.pending||[];
    location.hash='#/result/'+r.problem.id;route();setTimeout(runAgent,350);
  }catch(e){$('#stage').innerHTML=`<div class="err">${esc(e.message)}</div>`}
}

const LOOP=[

  ['It reads the literature','It writes its own searches, including ones that deliberately leave your field, and explains your result against what it actually retrieved.'],
  ['It asks other fields','It restates your problem in another field\'s vocabulary and puts it to every other agent. Most say no. The ones that say yes name something specific they could do.'],
  ['You get a brief and an introduction','Ranked explanations, each with one experiment that would settle it, and a drafted message to the person who could help.'],
  ['You decide who sees it','Everything starts visible to your lab only. Before you widen it, your agent shows you what it flagged about the result itself.']];

const PARTS=[

async function sendChat(text,already){
  if(!already)CHAT.push({role:'you',text});
  const box=$('#cin');if(box)box.value='';

  try{

    const {job}=await api('/api/chat',{method:'POST',
      body:JSON.stringify({message:text,history:hist})});
    const r=await poll(job,tick);
    $('#cwait').innerHTML='';
    const act=r.suggests?{kind:r.suggests,id:r.suggests_id,
      label:r.suggests_label||(r.suggests==='log'?'Log it':'Do it')}:null;
    CHAT.push({role:'agent',text:r.reply||'',act});

      <div class="chips">${(s.can_offer||[]).map(o=>`<span class="tag known">${esc(o)}</span>`).join('')}</div>
      <div class="chips">${(s.techniques||[]).map(o=>`<span class="tag">${esc(o)}</span>`).join('')}</div>
    </div></td></tr>`).join('')}</tbody></table>
    <h2>Open requests <span class="n">${signals.length}</span>
      <span class="note">restated so other fields can recognise them</span></h2>
    <table class="t"><colgroup><col style="width:22px"><col><col style="width:150px"></colgroup>
    <tbody>${signals.map(s=>`<tr class="row">
      <td class="dot"><span class="mk scope"></span></td>
      <td class="clip" title="${esc(s.headline||'')}">${esc(s.headline||'')}</td>
      <td class="c">${esc(s.scientist?.name||'')}</td></tr>
    <tr class="det hide"><td colspan="3"><div class="card">
      <p class="why">${esc(s.plain||'')}</p></div></td></tr>`).join('')}</tbody></table>`,'net');
  wire();expandable();
}
boot();
</script>
</body>
</html>
